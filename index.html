<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="bootstrap.css">
<head>

 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width">

 <title>Ejercicio de servicio</title>

</head>

<body>
<nav class="navbar" style="background-color: #9EFFA6">
  <div class="container-fluid">
    <h5 class="navbar-brand" style="color:#3884FF">
      <img src="logo UTN sin fondo.webp" alt="Logo" width="40" height="34" class="d-inline-block align-text-top">
      Ejemplo de servicio
    </div>
  </div>
</nav>
<br>
 <button onclick="ejecuta()" class="btn btn-primary">
  Créditos
 </button>
 <script>

  async function ejecuta() {
   try {
    // Se conecta a servicio.php y recibe su respuesta.
    const respuesta =
     await fetch("servicio.php")
    if (respuesta.ok) {
     const texto =
      await respuesta.text()
     alert(texto)
    } else {
     throw new Error(
      respuesta.statusText)
    }
   } catch (error) {
    console.error(error)
    alert(error.message)
   }
  }

 </script>

</body>

</html>
